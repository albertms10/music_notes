<svg xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" width="490" style="max-height: 150px;" viewBox="0 0 490 150"><style>html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}:root{--subtleText:#777;--highlightText:hotpink;--itemHeadingBackground:#eee;--background:white;--borderColor:#ccc;--textColor:#111;--diagramBackground:#f8f8f8;--diagramLines:black;--diagramText:black;--terminalLines:black;--terminalFill:#feffdf;--nonTerminalLines:black;--nonTerminalFill:#feffdf;--specialSequenceLines:black;--specialSequenceFill:#ffe79a;--ebnfCodeBackground:#e8e8e8;--ebnfIdentifier:#ef5a5a;--ebnfTerminal:#ffa952;--ebnfBaseColor:#777}html{font-family:sans-serif}html,body{margin:0;padding:0;background:var(--background);color:var(--textColor)}a{color:inherit}a:visited{color:var(--subtleText)}a:active,a:focus,a:hover{color:var(--highlightText)}header{border-bottom:1px solid var(--borderColor);padding:1rem}header button{display:none}main{overflow:hidden;margin-left:300px}nav{position:sticky;top:0;max-height:100vh;padding:1rem 2rem 1rem 1rem;z-index:5;background:var(--background);width:300px;float:left;overflow:auto}nav h3{white-space:nowrap}nav ul{list-style:none;padding:0}nav a{display:inline-block;color:var(--subtleText);text-decoration:none;padding:0.33rem 0}article{width:100%;overflow:hidden;padding:1rem 2rem;border-left:1px solid var(--borderColor)}article + footer{padding:1rem 2rem;border-left:1px solid var(--borderColor);background:var(--itemHeadingBackground)}code{width:100%}pre{overflow:auto}pre > code{display:block;padding:1em;background:var(--diagramBackground)}h4{padding:2rem;margin:4rem -2rem 1rem -2rem;background:var(--itemHeadingBackground);font-size:125%}blockquote{margin-left:0;margin-top:calc(1em - 1px);margin-bottom:calc(1em - 1px);padding:1px 0 1px 1rem;border-left:1rem solid var(--ebnfCodeBackground)}dfn{font-style:normal;cursor:default}@media (max-width:800px){body{overflow-x:hidden}header{padding:0.5rem 1rem;display:flex}header h1{margin:0 auto 0 0;display:flex;align-items:center}header button{display:initial;position:relative;z-index:10}header button::after{content:'☰';margin-left:auto;font-size:1.5rem}main{display:block;position:relative;margin-left:0}nav{height:auto;display:block;pointer-events:none;opacity:0;transition:opacity 0.2s,transform 0.2s;position:absolute;top:0;right:0;transform:translateX(300px);padding-top:3rem;background:var(--background);box-shadow:0 0 0 1000000rem rgba(0,0,0,0.35)}.menu-open nav{pointer-events:auto;opacity:1;transform:translateX(0px)}nav a{padding:0.66rem 0}article{margin-left:0;border-left:0;padding:1rem}article + footer{padding:1rem;border-left:0}}svg.railroad-diagram{width:100%}svg.railroad-diagram path{stroke-width:3;stroke:var(--diagramLines);fill:rgba(0,0,0,0)}svg.railroad-diagram text{font:bold 14px monospace;text-anchor:middle;fill:var(--diagramText)}svg.railroad-diagram text.diagram-text{font-size:12px}svg.railroad-diagram text.diagram-arrow{font-size:16px}svg.railroad-diagram text.label{text-anchor:start}svg.railroad-diagram text.comment{font:italic 12px monospace}svg.railroad-diagram g.non-terminal text{}svg.railroad-diagram g.special-sequence rect{fill:var(--specialSequenceFill);stroke:var(--specialSequenceLines)}svg.railroad-diagram g.special-sequence text{font-style:italic}svg.railroad-diagram rect{stroke-width:3}svg.railroad-diagram rect.group-box{stroke:gray;stroke-dasharray:10 5;fill:none}svg.railroad-diagram g.non-terminal rect{fill:var(--nonTerminalFill);stroke:var(--nonTerminalLines)}svg.railroad-diagram g.terminal rect{fill:var(--terminalFill);stroke:var(--terminalLines)}svg.railroad-diagram path.diagram-text{stroke-width:3;stroke:black;fill:white;cursor:help}svg.railroad-diagram g.diagram-text:hover path.diagram-text{fill:#eee}</style><g transform="translate(.5 .5)"><g><path d="M20 37v20m0 -10h20"></path></g><path d="M40 47h10"></path><g><path d="M50 47h0"></path><path d="M50 47h10"></path><g><path d="M60 47h10"></path><path d="M420 47h10"></